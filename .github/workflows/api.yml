name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Focused correctness lint
        run: ruff check src tests --select E4,E7,E9,F
      - name: API tests
        run: pytest -q

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed environment and private-key files
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)(id_rsa|id_ed25519)$|\.(pem|key)$'; then
            echo "Potential secret-bearing file is tracked; investigate before release."
            exit 1
          fi
      - name: Validate required project governance documents
        shell: bash
        run: |
          test -s docs/audits/full-project-audit-2026-11-27.md
          test -s docs/requirements/complete-ecosystem-coverage-register.md
          test -s country-profiles/UG/0.1.0-draft.md
